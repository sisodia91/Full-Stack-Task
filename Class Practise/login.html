<!DOCTYPE html>
<html>
<head>
    <title>Simple Login Page</title>

    <style>
        body{
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login{
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 250px;
            text-align: center;
            border-color: aqua;
        }

        input{
            width: 90%;
            padding: 8px;
            margin: 10px 0;
        }

        button{
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            border-radius: 6px;   
        }
    </style>
</head>

<body>

    <div class="login">
        <h2>Login</h2>

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <button>Login</button>
    </div>

</body>
</html>
