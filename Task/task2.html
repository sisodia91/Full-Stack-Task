<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopKart — Laptops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#F8FAFC',
          heading: '#111827',
          body: '#6B7280',
          primary: '#2563EB',
          sale: '#DC2626',
          border: '#E5E7EB',
          rating: '#F59E0B',
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .card-img { transition: transform .3s ease; }
  .product-card:hover .card-img { transform: scale(1.06); }
  .product-card { transition: box-shadow .2s ease, border-color .2s ease; }
  .product-card:hover { box-shadow: 0 10px 25px -5px rgba(17,24,39,0.12); border-color: #E5E7EB; }
  details[open] summary .chevron { transform: rotate(180deg); }
</style>
</head>
<body class="bg-bg text-body">

  <!-- Top nav -->
  <header class="bg-white border-b border-border sticky top-0 z-20">
    <div class="max-w-[1400px] mx-auto px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2 shrink-0">
        <span class="w-7 h-7 rounded-md bg-primary flex items-center justify-center text-white text-sm font-bold">S</span>
        <span class="text-heading font-semibold text-[16px] hidden sm:inline">ShopKart</span>
      </div>

      <div class="flex-1 max-w-md relative hidden sm:block">
        <input type="text" placeholder="Search for products..." class="w-full border border-border rounded-md pl-4 pr-10 py-2 text-[14px] focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-body" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>

      <div class="flex items-center gap-4 shrink-0">
        <button aria-label="Cart" class="relative">
          <svg class="w-5 h-5 text-heading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        </button>
        <button aria-label="Account">
          <svg class="w-5 h-5 text-heading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 5-6 8-6s6.4 2 8 6"/></svg>
        </button>
        <button id="mobileFilterBtn" class="lg:hidden" aria-label="Filters">
          <svg class="w-5 h-5 text-heading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </button>
      </div>
    </div>
    <div class="max-w-[1400px] mx-auto px-6 pb-3 text-[13px] text-body sm:hidden">
      Electronics <span class="mx-1">/</span> Laptops
    </div>
  </header>

  <div class="max-w-[1400px] mx-auto px-6 py-6">
    <div class="text-[13px] text-body mb-4 hidden sm:block">Electronics <span class="mx-1">/</span> Laptops</div>

    <div class="flex flex-col lg:flex-row gap-8">

      <!-- Sidebar (desktop) -->
      <aside class="hidden lg:block w-[240px] shrink-0">
        <div class="bg-white border border-border rounded-xl p-4 sticky top-24">
          <h2 class="text-[16px] font-semibold text-heading mb-4">Filters</h2>

          <div class="mb-5">
            <h3 class="text-[14px] font-medium text-heading mb-2">Category</h3>
            <div class="flex flex-col gap-2 text-[14px]">
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> Laptops</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> Desktops</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> Tablets</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> Accessories</label>
            </div>
          </div>

          <div class="mb-5">
            <h3 class="text-[14px] font-medium text-heading mb-2">Price Range</h3>
            <div class="flex flex-col gap-2 text-[14px]">
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> ₹0 – ₹20,000</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> ₹20,000 – ₹50,000</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> ₹50,000 – ₹75,000</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> ₹75,000+</label>
            </div>
          </div>

          <div class="mb-5">
            <h3 class="text-[14px] font-medium text-heading mb-2">Brand</h3>
            <div class="flex flex-col gap-2 text-[14px]">
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> Dell</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> HP</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> Lenovo</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> Apple</label>
            </div>
          </div>

          <button class="w-full bg-primary hover:bg-blue-700 text-white text-[14px] font-medium py-2 rounded-md transition-colors">Apply Filters</button>
        </div>
      </aside>

      <!-- Tablet/mobile horizontal filter bar -->
      <div class="lg:hidden bg-white border border-border rounded-xl p-3 flex items-center gap-3">
        <details class="relative">
          <summary class="list-none flex items-center gap-1 text-[14px] font-medium text-heading cursor-pointer px-3 py-1.5 border border-border rounded-md">
            Filters
            <svg class="chevron w-3.5 h-3.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </summary>
          <div class="absolute mt-2 w-64 bg-white border border-border rounded-lg shadow-lg p-4 z-10">
            <h3 class="text-[14px] font-medium text-heading mb-2">Category</h3>
            <div class="flex flex-col gap-2 text-[14px] mb-3">
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> Laptops</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-primary"> Desktops</label>
            </div>
            <button class="w-full bg-primary hover:bg-blue-700 text-white text-[14px] font-medium py-2 rounded-md transition-colors">Apply Filters</button>
          </div>
        </details>

        <details class="relative">
          <summary class="list-none flex items-center gap-1 text-[14px] font-medium text-heading cursor-pointer px-3 py-1.5 border border-border rounded-md">
            Sort
            <svg class="chevron w-3.5 h-3.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </summary>
          <div class="absolute mt-2 w-48 bg-white border border-border rounded-lg shadow-lg p-2 z-10 text-[14px]">
            <button class="block w-full text-left px-2 py-1.5 rounded hover:bg-bg">Popularity</button>
            <button class="block w-full text-left px-2 py-1.5 rounded hover:bg-bg">Price: Low to High</button>
            <button class="block w-full text-left px-2 py-1.5 rounded hover:bg-bg">Price: High to Low</button>
          </div>
        </details>
      </div>

      <!-- Products -->
      <div class="flex-1">
        <div class="hidden lg:flex items-center justify-between mb-5">
          <span class="text-[14px] text-body">Showing 12 results</span>
          <div class="flex items-center gap-2 text-[14px]">
            <span class="text-body">Sort by:</span>
            <select class="border border-border rounded-md px-2 py-1.5 text-heading focus:outline-none focus:ring-2 focus:ring-primary/30">
              <option>Popularity</option>
              <option>Price: Low to High</option>
              <option>Price: High to Low</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="productGrid">
          <!-- cards injected -->
        </div>
      </div>
    </div>
  </div>

<script>
  const products = [
    { name: "Dell Inspiron 15", price: "₹45,990", old: "₹60,990", rating: "4.5", count: "1.2k", badge: "SALE", img: "linear-gradient(135deg,#dbeafe,#93c5fd)" },
    { name: "HP Pavilion", price: "₹52,990", old: null, rating: "4.3", count: "892", badge: "NEW", img: "linear-gradient(135deg,#e0e7ff,#a5b4fc)" },
    { name: "Lenovo IdeaPad", price: "₹38,990", old: null, rating: "4.2", count: "654", badge: null, img: "linear-gradient(135deg,#f1f5f9,#cbd5e1)" },
    { name: "MacBook Air M2", price: "₹92,990", old: "₹99,990", rating: "4.8", count: "3.1k", badge: null, img: "linear-gradient(135deg,#e9d5ff,#c4b5fd)" },
    { name: "ASUS Vivobook", price: "₹41,990", old: "₹47,990", rating: "4.4", count: "728", badge: null, img: "linear-gradient(135deg,#dbeafe,#93c5fd)" },
    { name: "Dell XPS 13", price: "₹89,990", old: null, rating: "4.6", count: "1.4k", badge: null, img: "linear-gradient(135deg,#e0e7ff,#a5b4fc)" },
    { name: "Dell Inspiron 15", price: "₹45,990", old: "₹60,990", rating: "4.5", count: "1.2k", badge: "SALE", img: "linear-gradient(135deg,#dbeafe,#93c5fd)" },
    { name: "HP Pavilion", price: "₹52,990", old: null, rating: "4.3", count: "892", badge: null, img: "linear-gradient(135deg,#f1f5f9,#cbd5e1)" },
    { name: "HP Pavilion", price: "₹52,990", old: null, rating: "4.3", count: "892", badge: null, img: "linear-gradient(135deg,#e0e7ff,#a5b4fc)" },
    { name: "MacBook Air M2", price: "₹38,990", old: null, rating: "4.3", count: "654", badge: null, img: "linear-gradient(135deg,#e9d5ff,#c4b5fd)" },
    { name: "Dell Inspiron 15", price: "₹45,990", old: "₹60,990", rating: "4.5", count: "1.2k", badge: null, img: "linear-gradient(135deg,#dbeafe,#93c5fd)" },
    { name: "HP Pavilion", price: "₹52,990", old: null, rating: "4.3", count: "892", badge: null, img: "linear-gradient(135deg,#f1f5f9,#cbd5e1)" },
  ];

  const grid = document.getElementById('productGrid');
  grid.innerHTML = products.map(p => `
    <div class="product-card bg-white border border-border rounded-xl overflow-hidden flex flex-col" style="width:100%;">
      <div class="relative overflow-hidden" style="height:220px; background:${p.img};">
        ${p.badge ? `<span class="absolute top-2 left-2 text-white text-[11px] font-semibold px-2 py-1 rounded ${p.badge === 'SALE' ? 'bg-sale' : 'bg-green-600'}">${p.badge}</span>` : ''}
        <button aria-label="Wishlist" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 flex items-center justify-center">
          <svg class="w-4 h-4 text-heading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        </button>
        <div class="card-img absolute inset-0 flex items-center justify-center">
          <svg class="w-16 h-16 text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M2 20h20"/></svg>
        </div>
      </div>
      <div class="p-4 flex flex-col flex-1">
        <span class="text-[13px] text-body">Laptops</span>
        <h3 class="text-[16px] font-semibold text-heading mt-1 leading-snug">${p.name}</h3>
        <div class="flex items-center gap-1 mt-1.5 text-[14px]">
          <svg class="w-3.5 h-3.5 text-rating" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <span class="text-heading font-medium">${p.rating}</span>
          <span class="text-body">(${p.count})</span>
        </div>
        <div class="flex items-baseline gap-2 mt-2">
          <span class="text-[20px] font-bold text-heading">${p.price}</span>
          ${p.old ? `<span class="text-[14px] text-body line-through">${p.old}</span>` : ''}
        </div>
        <button class="mt-3 w-full bg-primary hover:bg-blue-700 text-white text-[14px] font-medium py-2 rounded-md transition-colors">Add to Cart</button>
      </div>
    </div>
  `).join('');
</script>
</body>
</html>
