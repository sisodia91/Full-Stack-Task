<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdminPro – Analytics Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
  colors: { page:'#F1F5F9', side:'#0F172A', sidetext:'#CBD5E1', active:'#4F46E5', head:'#0F172A', body:'#64748B', line:'#E2E8F0', ok:'#16A34A', bad:'#DC2626', warn:'#D97706', primary:'#2563EB' }
}}}
</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#F1F5F9}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
</style>
</head>
<body class="bg-page text-body antialiased">

<div id="overlay" class="fixed inset-0 z-30 bg-black/40 hidden md:hidden"></div>

<div class="flex min-h-screen">

  <!-- Sidebar: 240px desktop, icon rail tablet, drawer mobile -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-60 -translate-x-full flex-col justify-between bg-side text-sidetext transition-transform duration-200 md:sticky md:top-0 md:h-screen md:w-16 md:translate-x-0 lg:w-60">
    <div>
      <div class="flex h-16 items-center gap-3 px-4 md:justify-center lg:justify-start">
        <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-primary text-white">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10l8-6 8 6v10"/><path d="M9 20v-6h6v6"/></svg>
        </div>
        <span class="text-lg font-bold text-white md:hidden lg:inline">AdminPro</span>
      </div>
      <nav id="nav" class="mt-2 flex flex-col gap-1 px-3"></nav>
    </div>
    <div class="flex items-center gap-3 border-t border-white/10 p-4 md:justify-center lg:justify-start">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-amber-400 text-sm font-semibold text-side">AT</div>
      <div class="md:hidden lg:block">
        <p class="text-sm font-semibold text-white">Ayush Tiwari</p>
        <p class="text-xs text-sidetext/70">Admin</p>
      </div>
    </div>
  </aside>

  <!-- Main column -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex h-16 w-full items-center justify-between gap-4 border-b border-line bg-white px-4 sm:px-6 lg:px-8">
      <div class="flex flex-1 items-center gap-3">
        <button id="burger" aria-label="Open menu" class="rounded-lg p-2 text-head hover:bg-page md:hidden">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <label class="flex w-full max-w-xs items-center gap-2 rounded-lg border border-line bg-page px-3 py-2 focus-within:border-active focus-within:ring-2 focus-within:ring-active/20">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" placeholder="Search..." class="w-full bg-transparent text-sm text-head outline-none placeholder:text-body">
        </label>
      </div>
      <div class="flex items-center gap-4">
        <button aria-label="Notifications" class="relative rounded-lg p-2 text-body hover:bg-page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-bad"></span>
        </button>
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-amber-400 text-sm font-semibold text-side">AT</div>
      </div>
    </header>

    <main class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
      <h1 class="text-2xl font-bold text-head">Dashboard</h1>

      <!-- KPIs -->
      <section id="kpis" class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-4"></section>

      <!-- Revenue + Recent orders (2fr 1fr) -->
      <section class="grid grid-cols-1 gap-6 lg:grid-cols-[2fr_1fr]">
        <div class="min-w-0 rounded-xl border border-line bg-white p-5">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-semibold text-head">Revenue Overview</h2>
            <div class="text-right">
              <p class="text-base font-semibold text-head">₹1,24,532</p>
              <p class="text-xs font-medium text-ok">+12%</p>
            </div>
          </div>
          <div class="mt-4 flex gap-3">
            <div class="flex h-48 flex-col justify-between pb-1 text-xs text-body"><span>1.5L</span><span>1L</span><span>50k</span><span>0</span></div>
            <div class="min-w-0 flex-1">
              <svg id="rev" viewBox="0 0 600 190" preserveAspectRatio="none" class="h-48 w-full overflow-visible">
                <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563EB" stop-opacity=".25"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></linearGradient></defs>
              </svg>
              <div class="mt-2 flex justify-between text-xs text-body" id="months"></div>
            </div>
          </div>
        </div>

        <div class="min-w-0 rounded-xl border border-line bg-white p-5">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-semibold text-head">Recent Orders</h2>
            <a href="#" class="text-xs font-medium text-primary hover:underline">View all</a>
          </div>
          <div class="mt-3 overflow-x-auto">
            <table class="w-full min-w-[380px] text-left text-sm">
              <thead><tr class="text-xs text-body"><th class="py-2 font-medium">Customer</th><th class="py-2 font-medium">Amount</th><th class="py-2 font-medium">Status</th></tr></thead>
              <tbody id="orders" class="text-head"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Traffic + Top products (50/50) -->
      <section class="grid grid-cols-1 gap-6 lg:grid-cols-2">
        <div class="min-w-0 rounded-xl border border-line bg-white p-5">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-semibold text-head">Traffic Overview</h2>
            <span class="text-sm font-semibold text-ok">▲ 18%</span>
          </div>
          <p class="mt-3 text-[28px] font-bold leading-none text-head">8,432</p>
          <p class="mt-1 text-xs text-body">Total Visitors</p>
          <div id="bars" class="mt-4 flex h-40 items-end justify-between gap-2 sm:gap-4"></div>
        </div>

        <div class="min-w-0 rounded-xl border border-line bg-white p-5">
          <h2 class="text-base font-semibold text-head">Top Products</h2>
          <div class="mt-3 overflow-x-auto">
            <table class="w-full min-w-[380px] text-left text-sm">
              <thead><tr class="text-xs text-body"><th class="py-2 font-medium">Product</th><th class="py-2 font-medium">Sales</th><th class="py-2 font-medium">Change</th></tr></thead>
              <tbody id="products" class="text-head"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
const ic = p => `<svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
  chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
  users:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l3 12h11l2-8H6"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  rupee:'<path d="M6 4h12M6 9h12M6 4c8 0 8 10 0 10h-1l8 7"/>',
  bag:'<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  bolt:'<path d="m13 2-9 12h7l-1 8 9-12h-7z"/>'
};

// Sidebar
const menu = [['Dashboard','dash'],['Analytics','chart'],['Users','users'],['Orders','cart'],['Products','box'],['Settings','gear']];
document.getElementById('nav').innerHTML = menu.map(([n,i],k) =>
  `<a href="#" title="${n}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium md:justify-center lg:justify-start ${k===0?'bg-active text-white':'hover:bg-white/5 hover:text-white'}">${ic(I[i])}<span class="md:hidden lg:inline">${n}</span></a>`).join('');

// KPIs
const kpis = [
  ['Total Revenue','₹1,24,532','+12% from last month','rupee','bg-green-50 text-ok'],
  ['Total Orders','892','+8% from last month','bag','bg-blue-50 text-primary'],
  ['Active Users','3,521','+14% from last month','users','bg-indigo-50 text-active'],
  ['Conversion Rate','4.2%','+2% from last month','bolt','bg-amber-50 text-warn']
];
document.getElementById('kpis').innerHTML = kpis.map(([l,v,c,i,t]) => `
  <div class="flex flex-col gap-3 rounded-xl border border-line bg-white p-5">
    <div class="flex h-10 w-10 items-center justify-center rounded-lg ${t}">${ic(I[i])}</div>
    <p class="text-sm font-medium text-body">${l}</p>
    <p class="text-[28px] font-bold leading-none text-head">${v}</p>
    <p class="text-xs font-medium text-ok">↑ <span class="text-body font-normal">${c}</span></p>
  </div>`).join('');

// Revenue chart
const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
document.getElementById('months').innerHTML = months.map(m=>`<span>${m}</span>`).join('');
const d = [62,68,58,78,74,96,92,112], W=600, H=190, max=150;
const pts = d.map((v,i)=>[i*W/(d.length-1), H - v/max*H]);
const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
document.getElementById('rev').insertAdjacentHTML('beforeend',
  [0,1,2,3].map(k=>`<line x1="0" x2="${W}" y1="${k*H/3}" y2="${k*H/3}" stroke="#E2E8F0" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`).join('') +
  `<path d="${line} L${W} ${H} L0 ${H}Z" fill="url(#g)"/><path d="${line}" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`);

// Orders
const badge = {Delivered:'bg-green-50 text-ok',Processing:'bg-blue-50 text-primary',Shipped:'bg-indigo-50 text-active',Cancelled:'bg-red-50 text-bad'};
const orders = [['Rahul Sharma','₹2,499','Delivered'],['Priya Singh','₹2,499','Processing'],['Amit Kumar','₹1,799','Shipped'],['Neha Gupta','₹3,299','Delivered'],['Sahil Verma','₹5,499','Cancelled']];
document.getElementById('orders').innerHTML = orders.map(([n,a,s])=>`
  <tr class="border-t border-line"><td class="py-3 pr-2 font-medium">${n}</td><td class="py-3 pr-2">${a}</td>
  <td class="py-3"><span class="rounded-full px-2 py-0.5 text-xs font-medium ${badge[s]}">${s}</span></td></tr>`).join('');

// Traffic bars
const days = [['Mon',42],['Tue',52],['Wed',60],['Thu',48],['Fri',68],['Sat',58],['Sun',100]];
document.getElementById('bars').innerHTML = days.map(([n,h])=>`
  <div class="flex h-full flex-1 flex-col items-center justify-end gap-2">
    <div class="w-full max-w-[28px] rounded-t-md bg-primary" style="height:${h}%"></div>
    <span class="text-xs text-body">${n}</span>
  </div>`).join('');

// Products
const prods = [['Laptop Pro','2,450','+12%'],['Wireless Earbuds','1,892','+8%'],['Smart Watch','1,203','+6%'],['Backpack','982','+4%']];
document.getElementById('products').innerHTML = prods.map(([n,s,c])=>`
  <tr class="border-t border-line"><td class="py-3 pr-2 font-medium">${n}</td><td class="py-3 pr-2">${s}</td><td class="py-3 font-medium text-ok">${c}</td></tr>`).join('');

// Mobile drawer
const sb = document.getElementById('sidebar'), ov = document.getElementById('overlay');
const toggle = open => { sb.classList.toggle('-translate-x-full', !open); ov.classList.toggle('hidden', !open); };
document.getElementById('burger').onclick = () => toggle(true);
ov.onclick = () => toggle(false);
</script>
</body>
</html>
